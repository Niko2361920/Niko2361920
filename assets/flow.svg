<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-label="Flujo de trabajo: problema real, modelado y diseño, prototipo funcional, despliegue, medición, y vuelta a iterar">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#38bdf8"/>
    </marker>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13213a"/>
      <stop offset="1" stop-color="#0e1a2e"/>
    </linearGradient>
    <style>
      .box   { fill: url(#card); stroke: #38bdf8; stroke-opacity: 0.55; stroke-width: 1.4; }
      .label { font: 600 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .num   { font: 400 12px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #38bdf8; text-anchor: middle; letter-spacing: 1px; }
      .link  { stroke: #38bdf8; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .loop  { stroke: #34d399; stroke-width: 1.8; fill: none; stroke-dasharray: 6 6; marker-end: url(#arrow); animation: dash 1.6s linear infinite; }
      .loopt { font: 400 12px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #34d399; text-anchor: middle; letter-spacing: 1px; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
    </style>
  </defs>

  <rect width="1000" height="180" rx="14" fill="#0b1220"/>

  <!-- cajas -->
  <g>
    <rect class="box" x="30"  y="38" width="150" height="62" rx="10"/>
    <rect class="box" x="225" y="38" width="150" height="62" rx="10"/>
    <rect class="box" x="420" y="38" width="150" height="62" rx="10"/>
    <rect class="box" x="615" y="38" width="150" height="62" rx="10"/>
    <rect class="box" x="810" y="38" width="150" height="62" rx="10"/>
  </g>

  <!-- numeración -->
  <text class="num" x="105" y="30">01</text>
  <text class="num" x="300" y="30">02</text>
  <text class="num" x="495" y="30">03</text>
  <text class="num" x="690" y="30">04</text>
  <text class="num" x="885" y="30">05</text>

  <!-- textos -->
  <text class="label" x="105" y="75">Problema real</text>
  <text class="label" x="300" y="64">Modelado</text>
  <text class="label" x="300" y="83">y diseño</text>
  <text class="label" x="495" y="64">Prototipo</text>
  <text class="label" x="495" y="83">funcional</text>
  <text class="label" x="690" y="75">Despliegue</text>
  <text class="label" x="885" y="75">Medición</text>

  <!-- flechas -->
  <path class="link" d="M182 69 H221"/>
  <path class="link" d="M377 69 H416"/>
  <path class="link" d="M572 69 H611"/>
  <path class="link" d="M767 69 H806"/>

  <!-- iteración -->
  <path class="loop" d="M885 102 V140 H300 V104"/>
  <text class="loopt" x="592" y="162">iterar con lo aprendido</text>
</svg>
